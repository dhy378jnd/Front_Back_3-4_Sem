<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 250px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .product-card h2 {
            font-size: 1.2rem;
            margin: 0 0 10px;
            color: #007bff;
        }
        .product-card p {
            margin: 5px 0;
            font-size: 0.95rem;
        }
        .product-card strong {
            color: #333;
        }
        #chat-box {
            border: 1px solid black;
            height: 200px;
            overflow-y: scroll;
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
<h1>Каталог товаров</h1>
<div id="products"></div>

<div id="chat-box"></div>
<input id="message-input" type="text">
<button onclick="sendMessage()">Отправить</button>

<script>
    const ws = new WebSocket("ws://localhost:4000");
    ws.onmessage = event => {
        const chatBox = document.getElementById("chat-box");
        const message = document.createElement("p");
        message.textContent = event.data;
        chatBox.appendChild(message);
    };
    function sendMessage() {
        const input = document.getElementById("message-input");
        ws.send(input.value);
        input.value = "";
    }
</script>
<script src="script.js"></script>
</body>
</html>
