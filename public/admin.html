<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка</title>
</head>
<body>
<h1>Админка</h1>
<button onclick="addProduct()">Добавить товар</button>
<button onclick="deleteProduct()">Удалить товар</button>
<button onclick="editProduct()">Редактировать товар</button>

<div id="chat-box" style="border: 1px solid black; height: 200px; overflow-y: scroll; margin-top: 20px; padding: 10px;"></div>
<input id="message-input" type="text">
<button onclick="sendMessage()">Отправить</button>

<script>
    const ws = new WebSocket("ws://localhost:4000");
    ws.onmessage = event => {
        const chatBox = document.getElementById("chat-box");
        const message = document.createElement("p");
        message.textContent = event.data;
        chatBox.appendChild(message);
    };
    function sendMessage() {
        const input = document.getElementById("message-input");
        ws.send(input.value);
        input.value = "";
    }
</script>

<script src="admin.js"></script>
</body>
</html>
